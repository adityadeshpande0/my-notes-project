<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Visual, interactive notes for learning React and data structures & algorithms."
    />
    <meta name="theme-color" content="#0B0F1A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Stackscape · Visual notes for React & DSA</title>

    <!-- Set the saved theme before first paint, so there's no flash of the wrong theme. -->
    <script>
      try {
        var t = localStorage.getItem('stackscape-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap"
    />
    <!--
      Loading screen. Plain HTML + CSS so it paints instantly, before any
      JavaScript arrives. React removes it once the app is ready
      (src/app/splash.ts). Colours repeat the theme tokens because the main
      stylesheet hasn't loaded yet.
    -->
    <style>
      #splash {
        --s-bg: #0b0f1a;
        --s-text: #e6eaf2;
        --s-muted: #8a94ad;
        --s-track: #1a2238;
        --s-1: #7c9cff;
        --s-2: #3de0c5;
        --s-3: #5be38a;
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: var(--s-bg);
        color: var(--s-text);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        transition: opacity 300ms ease;
        /* Safety net: if the app never starts, don't hide the page forever. */
        animation: splash-giveup 300ms ease 10s forwards;
      }
      [data-theme='light'] #splash {
        --s-bg: #f6f7fb;
        --s-text: #141a2b;
        --s-muted: #59637d;
        --s-track: #eceff6;
        --s-1: #4766d6;
        --s-2: #0f9e86;
        --s-3: #1c8f4c;
      }
      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 16px;
        text-align: center;
      }
      /* The logo's three bars, rising and falling like a chart being sorted. */
      .splash-bars {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 44px;
      }
      .splash-bars span {
        width: 12px;
        border-radius: 4px;
        animation: splash-bar 1.2s ease-in-out infinite;
      }
      .splash-bars span:nth-child(1) {
        height: 18px;
        background: var(--s-1);
      }
      .splash-bars span:nth-child(2) {
        height: 30px;
        background: var(--s-2);
        animation-delay: 150ms;
      }
      .splash-bars span:nth-child(3) {
        height: 44px;
        background: var(--s-3);
        animation-delay: 300ms;
      }
      .splash-name {
        font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      /* Three short lines that take turns, one at a time. */
      .splash-lines {
        position: relative;
        height: 1.4em;
        width: min(80vw, 22rem);
        color: var(--s-muted);
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.8rem;
      }
      .splash-lines span {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: splash-line 4.5s infinite;
      }
      .splash-lines span:nth-child(2) {
        animation-delay: 1.5s;
      }
      .splash-lines span:nth-child(3) {
        animation-delay: 3s;
      }
      .splash-track {
        width: 160px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--s-track);
      }
      .splash-track::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--s-2);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-bar {
        50% {
          transform: scaleY(0.45);
        }
      }
      .splash-bars span {
        transform-origin: bottom;
      }
      @keyframes splash-line {
        0%,
        100% {
          opacity: 0;
          transform: translateY(4px);
        }
        8%,
        30% {
          opacity: 1;
          transform: none;
        }
        38% {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @keyframes splash-giveup {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      /* Less motion: keep it still, show only the first line. */
      @media (prefers-reduced-motion: reduce) {
        .splash-bars span,
        .splash-track::after {
          animation: none;
        }
        .splash-lines span {
          animation: none;
        }
        .splash-lines span:first-child {
          opacity: 1;
        }
        .splash-track::after {
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div class="splash-inner">
        <div class="splash-bars" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="splash-name">Stackscape</div>
        <div class="splash-lines">
          <span>Loading your notes…</span>
          <span aria-hidden="true">Warming up the visualizers…</span>
          <span aria-hidden="true">Almost there…</span>
        </div>
        <div class="splash-track" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
